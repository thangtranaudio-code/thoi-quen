name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-apk:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Node dependencies
        run: npm install --no-audit --no-fund

      - name: Build Web Application (Vite)
        run: |
          npm run build
          cp -r dist www

      - name: Setup Capacitor & Prepare Android Project
        run: |
          npm install @capacitor/core @capacitor/cli @capacitor/android --no-audit --no-fund
          rm -rf android
          rm -f capacitor.config.ts capacitor.config.json
          npx cap init "Thoi Quen" "com.thoiquen.app" --web-dir dist
          npx cap add android
          npx cap sync android

      - name: Build Android Debug APK
        run: |
          cd android
          echo "android.enableJetifier=true" >> gradle.properties
          echo "configurations.all { exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk7'; exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk8' }" >> app/build.gradle
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload APK to GitHub Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ThoiQuen-Android-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30